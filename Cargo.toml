[workspace]
resolver = "3"
members = [
    "crates/tuyau-protocol",
    "crates/tuyau-server",
    "crates/tuyau-client",
    "crates/tuyau-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# QUIC + TLS
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.13"
sha2 = "0.10"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util", "fs", "sync"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
pin-project-lite = "0.2"

# Optional axum integration (behind tuyau-client's `axum` feature).
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }

# Serialization
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
toml = "0.8"
hex = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }
hostname = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "2"
anyhow = "1"

# Crypto utility
subtle = "2"
rand = "0.8"

# Test fixtures
tempfile = "3"

# Internal crates
tuyau-protocol = { path = "crates/tuyau-protocol" }
tuyau-server = { path = "crates/tuyau-server" }
tuyau-client = { path = "crates/tuyau-client" }
tuyau-cli = { path = "crates/tuyau-cli" }
