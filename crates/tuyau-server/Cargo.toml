[package]
name = "tuyau-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Expose the dynamic routing seam (RoutingBackend + TunnelServer::start_with)
# for embedders such as a managed control plane. Off by default: the self-host
# binary stays static/config-file only.
dynamic = []
# `impl axum::serve::Listener for InternalListener`, to serve an axum app on an
# internal listener
axum = ["dynamic", "dep:axum"]

[dependencies]
tuyau-protocol = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
rustls-acme = { workspace = true }
rcgen = { workspace = true }
time = { workspace = true }
# Read the SANs of an imported cert, to know the names it covers
x509-parser = "0.16"
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
parking_lot = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
tower-service = { workspace = true }
http-body-util = { workspace = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
