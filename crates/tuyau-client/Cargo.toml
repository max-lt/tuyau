[package]
name = "tuyau-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tuyau-protocol = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
pin-project-lite = { workspace = true }
axum = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[features]
default = []
# Enables `impl axum::serve::Listener for TunnelListener`, the drop-in adapter
# for embedding the tunnel into an existing axum/hyper HTTP application.
axum = ["dep:axum"]
# Enables `TlsTunnelListener` / `TunnelClient::tls_listener`: terminate TLS over
# the tunnel with the app's own cert (passthrough mode). Pairs with `axum` for
# the `axum::serve` one-liner.
tls = ["dep:tokio-rustls"]

[[example]]
name = "axum"
required-features = ["axum"]

[[example]]
name = "passthrough"
required-features = ["tls", "axum"]

[dev-dependencies]
tuyau-server = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tempfile = { workspace = true }
axum = { workspace = true }
anyhow = { workspace = true }
hostname = { workspace = true }
tracing-subscriber = { workspace = true }
rcgen = { workspace = true }
